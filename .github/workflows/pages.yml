# Publie l'application web sur GitHub Pages à chaque mise à jour de la branche main
# (y compris les mises à jour hebdomadaires des données).
name: Publication du site

on:
  push:
    branches: [main]
    # La veille quotidienne ne change rien au site.
    paths-ignore:
      - research/watch/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.indexnow.outputs.changed }}
      payload: ${{ steps.indexnow.outputs.payload }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build:pages
      # Pages modifiées depuis la version en ligne, signalées à IndexNow une fois publiées (job indexnow).
      - id: indexnow
        continue-on-error: true
        run: |
          npx tsx scripts/indexnow.ts
          echo "changed=$(jq '.urlList | length' indexnow-urls.json)" >> "$GITHUB_OUTPUT"
          echo "payload=$(cat indexnow-urls.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Prévient Bing (DuckDuckGo, Ecosia, recherche de ChatGPT…) des pages modifiées, sans attendre son passage.
  indexnow:
    needs: [build, deploy]
    if: needs.build.outputs.changed != '' && needs.build.outputs.changed != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Signaler les pages modifiées (IndexNow)
        continue-on-error: true
        env:
          PAYLOAD: ${{ needs.build.outputs.payload }}
        run: |
          curl -sS -o /dev/null -w "IndexNow : HTTP %{http_code} pour ${{ needs.build.outputs.changed }} page(s)\n" \
            -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data "$PAYLOAD"
